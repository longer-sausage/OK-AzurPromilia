site_name: OK-AzurPromilia
site_description: "Game automation tool for Azur Promilia, built with ok-script"
site_url: https://longer-sausage.github.io/OK-AzurPromilia/
repo_name: longer-sausage/OK-AzurPromilia
repo_url: https://github.com/longer-sausage/OK-AzurPromilia
edit_uri: edit/main/docs/
exclude_docs: README.md

validation:
  links:
    not_found: ignore
    unrecognized_links: ignore

strict: true

# 让标题锚点与 GitHub / IDE 保持一致，见 tools/mkdocs_github_slugify.py
hooks:
  - tools/mkdocs_github_slugify.py

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 项目首页: index.md
  - 开发:
    - 快速上手: dev/quickstart.md
    - 开发指南: dev/development.md
    - Action 生命周期: dev/action_lifecycle.md
    - 祖赞卡之梯判定分析: dev/jenga_judgment.md