name: Build

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types:
      - auto-release
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "repository_dispatch") {
            $raw = $env:CLIENT_PAYLOAD_TAG
          } else {
            $raw = $env:REF_NAME
          }
          $raw = $raw -replace "[\r\n]", ""
          "tag=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $safe = $raw -replace '[/\\:<>*?"|]', '-'
          "safe_tag=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Output immutable commit SHA
        id: sha
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv packaging==26.3

      - name: Verify requirements.txt reproducible
        run: |
          uv run --locked --no-sync python scripts/release/gen_release_requirements.py --check

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv --no-deps ok-script==2.0.6 pyappify==1.0.13

      - name: inline_ok_requirements
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          uv run --locked --no-sync python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: Run tests
        timeout-minutes: 5
        run: |
          python -u -m unittest discover -s tests -p "Test*.py" -v

  sync:
    needs: test
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read

    outputs:
      start_tag: ${{ steps.sync.outputs.start_tag }}
      end_tag: ${{ steps.sync.outputs.end_tag }}
      changes_with_asterisk: ${{ steps.sync.outputs.changes_with_asterisk }}

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "OK-AzurPromilia@users.noreply.github.com"
          git config --global user.name "OK-AzurPromilia"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "repository_dispatch") {
            $raw = $env:CLIENT_PAYLOAD_TAG
          } else {
            $raw = $env:REF_NAME
          }
          $raw = $raw -replace "[\r\n]", ""
          "tag=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $safe = $raw -replace '[/\\:<>*?"|]', '-'
          "safe_tag=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.sha }}
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv --no-deps ok-script==2.0.6 pyappify==1.0.13

      - name: inline_ok_requirements
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          uv run --locked --no-sync python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Sync Repositories
        id: sync
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/AliceJump/ok-ap-update.git
            https://AliceJump:${{ secrets.OK_GH }}@github.com/AliceJump/ok-ap-update.git
          sync_list: 'deploy.txt'
          tag: ${{ steps.tag.outputs.tag }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

  build:
    needs: [test, sync]
    if: always() && needs.test.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "repository_dispatch") {
            $raw = $env:CLIENT_PAYLOAD_TAG
          } else {
            $raw = $env:REF_NAME
          }
          $raw = $raw -replace "[\r\n]", ""
          "tag=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $safe = $raw -replace '[/\\:<>*?"|]', '-'
          "safe_tag=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.sha }}
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv --no-deps ok-script==2.0.6 pyappify==1.0.13

      - name: inline_ok_requirements
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          uv run --locked --no-sync python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master

      - name: Add version to build filenames
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.safe_tag }}
        run: |
          $version = "$env:VERSION"
          Get-ChildItem -Path pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-$version$($_.Extension)"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pyappify_dist-${{ steps.tag.outputs.safe_tag }}
          path: pyappify_dist/*

  release:
    needs: [build, sync]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'repository_dispatch'
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "repository_dispatch") {
            $raw = $env:CLIENT_PAYLOAD_TAG
          } else {
            $raw = $env:REF_NAME
          }
          $raw = $raw -replace "[\r\n]", ""
          "tag=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $safe = $raw -replace '[/\\:<>*?"|]', '-'
          "safe_tag=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: pyappify_dist-${{ steps.tag.outputs.safe_tag }}
          path: pyappify_dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: false
          body: |
            ![Windows](https://img.shields.io/badge/platform-Windows-blue)

            ### 下载 / Downloads

            不确定选哪个？**中国大陆用户选 China，其他地区选 Global。**
            Not sure? Pick **China** if you are in mainland China, otherwise **Global**.

            | 文件 / File | 适用情况 / When to use | 下载 / Download |
            | --- | --- | --- |
            | `ok-ap-win32-China-setup-${{ steps.tag.outputs.safe_tag }}.exe` | **中国大陆推荐。** 安装包自带运行环境，更新源为 CNB，国内下载与更新速度更快。<br>*Recommended in mainland China. The installer bundles its own runtime and updates from CNB, which is faster within China.* | [下载](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/ok-ap-win32-China-setup-${{ steps.tag.outputs.safe_tag }}.exe) |
            | `ok-ap-win32-Global-setup-${{ steps.tag.outputs.safe_tag }}.exe` | **海外推荐。** 安装包自带运行环境，更新源为 GitHub，无需访问国内服务。<br>*Recommended outside mainland China. The installer bundles its own runtime and updates from GitHub, with no dependency on China-only services.* | [下载](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/ok-ap-win32-Global-setup-${{ steps.tag.outputs.safe_tag }}.exe) |

            > **注意 / Note**
            > 安装包首次运行可能被 Windows Defender 拦截，选择「仍要运行」即可。
            > *Windows Defender may block the installer on first run — choose "Run anyway".*

            ### 更新日志 / Changelog

            `${{ needs.sync.outputs.start_tag }}` → `${{ needs.sync.outputs.end_tag }}`

            ${{ needs.sync.outputs.changes_with_asterisk }}
          files: pyappify_dist/**
