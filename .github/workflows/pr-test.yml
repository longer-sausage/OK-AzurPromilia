name: PR Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Output immutable commit SHA
        id: sha
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve branch name
        id: ref
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $raw = $env:HEAD_REF
          $raw = $raw -replace "[\r\n]", ""
          "branch=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $safe = $raw -replace '[/\\:<>*?"|]', '-'
          "safe_branch=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv packaging==26.3

      - name: Verify requirements.txt reproducible
        run: |
          uv run --locked --no-sync python scripts/release/gen_release_requirements.py --check

      - name: Install uv
        run: |
          pip install uv==0.10.9
          uv venv .venv
          uv pip install --python .venv --no-deps ok-script==2.0.6 pyappify==1.0.13

      - name: inline_ok_requirements
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.branch }}
        run: |
          uv run --locked --no-sync python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: Lint changed Python files
        # 只检查这次 PR 改动的 .py：存量文件里还有历史告警，全量检查会挡住所有 PR。
        # 新代码要求干净；确实需要保留的告警用 `# noqa: 规则名` 显式豁免。
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "${{ github.event.pull_request.base.sha }}"
          $files = @(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- "*.py")
          if ($files.Count -eq 0) {
            Write-Host "没有改动的 .py 文件，跳过 lint"
            exit 0
          }
          Write-Host "将检查 $($files.Count) 个文件："
          $files | ForEach-Object { Write-Host "  $_" }
          pip install "ruff>=0.16,<1"
          ruff check @files

      - name: Run tests
        timeout-minutes: 5
        run: |
          python -u -m unittest discover -s tests -p "test_*.py" -v

      # i18n 与安装自检以前只在本地手动跑，CI 不拦；这两步都很便宜（几秒），
      # 却能在 PR 阶段挡住「加了 tab 没翻译」「示例流程装了打不开」这类问题。
      - name: Validate i18n (6 locales, no empty msgstr)
        run: python scripts/validate_all.py

      - name: Install health check (flows / queues / routes / schemes / configs / i18n)
        run: python tools/health_check.py --strict

      # 测试不许往仓库里写文件：真实事故是 import_dataset 的备份默认落到仓库，
      # 几轮下来 8 个 growth_*.json 被 git add -A 一起提交了。测试自己不报错，
      # 只有跑完看一眼工作区才发现。这里在 CI 里强制看一眼。
      - name: Working tree must stay clean after tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(git status --porcelain)
          if ($dirty.Count -gt 0) {
            Write-Host "::error::测试跑完后工作区不干净（有测试往仓库里写了文件）"
            $dirty | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "工作区干净"
