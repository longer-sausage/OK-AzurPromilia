name: "ok-ap"
# 启动器界面图标；Windows EXE / 安装包图标由 release.yml 从此 PNG 生成 ICO。
icon: "icons/icon.png"
uac: true
profiles:
  - name: "China"
    git_url: "https://cnb.cool/alicejump/ok-ap-update.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    # --no-deps：用户端 pip 按 requirements.txt 精确安装，不自动拉传递依赖
    #（配合裁剪后的清单，去掉 pyside6-addons/QtWebEngine 约 200MB）
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true
    
  - name: "Global"
    git_url: "https://github.com/AliceJump/ok-ap-update.git"
    main_script: "main.py"
    requirements: "requirements.txt"
    pip_args: "--no-deps"

